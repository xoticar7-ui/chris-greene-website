name: Sync site navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-navigation.yml'
      - '*.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-site-navigation
  cancel-in-progress: false

jobs:
  sync-navigation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Standardize navigation across HTML pages
        shell: python
        run: |
          from pathlib import Path
          import re

          links = [
              ('index.html', 'Home'),
              ('about.html', 'About'),
              ('experience.html', 'Experience'),
              ('projects.html', 'Projects'),
              ('knowledge.html', 'Knowledge'),
              ('insights.html', 'Insights'),
              ('labs.html', 'Labs'),
              ('resources.html', 'Resources'),
              ('learning.html', 'Learning'),
              ('life.html', 'Beyond Work'),
              ('resume.html', 'Resume'),
          ]

          primary_pages = {href for href, _ in links}
          nav_pattern = re.compile(
              r'<nav\b[^>]*class=["\'][^"\']*\blinks\b[^"\']*["\'][^>]*>.*?</nav>',
              re.IGNORECASE | re.DOTALL,
          )

          changed = []

          for path in sorted(Path('.').glob('*.html')):
              html = path.read_text(encoding='utf-8')
              if not nav_pattern.search(html):
                  continue

              active_page = path.name if path.name in primary_pages else None
              items = []
              for href, label in links:
                  active = ' class="active"' if href == active_page else ''
                  items.append(f'        <a{active} href="{href}">{label}</a>')

              nav = (
                  '      <nav class="links" aria-label="Primary navigation">\n'
                  + '\n'.join(items)
                  + '\n      </nav>'
              )

              updated = nav_pattern.sub(nav, html, count=1)
              if updated != html:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.name)

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit synchronized navigation
        run: |
          if git diff --quiet; then
            echo "Navigation already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Synchronize navigation across site"
          git pull --rebase origin main
          git push origin main
